<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>just-NAS 家庭檔案</title><style>
:root{color-scheme:dark;font:16px system-ui;background:#0c1420;color:#e5edf7}body{max-width:1100px;margin:auto;padding:24px}button,input,select{font:inherit;padding:10px;border:1px solid #425166;border-radius:7px;background:#19283a;color:inherit}button,a{cursor:pointer}button{margin:4px}a{color:#5bd3ff}header,.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}header{justify-content:space-between}section{background:#121f30;padding:20px;border-radius:12px;margin:20px 0}label{display:block;margin:12px 0}label input{display:block;width:min(90%,400px)}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #304055;padding:12px}#message{white-space:pre-wrap;color:#ffce85;min-height:24px}small{color:#a6b7cd}#listing{overflow-x:auto}#upload-progress{width:100%}[hidden]{display:none!important}</style>
<header><h1>家庭檔案</h1><a href="/">管理控制台</a></header>
<section id="login"><h2>登入檔案帳號</h2><form id="login-form"><label>帳號<input id="username" autocomplete="username" required></label><label>密碼<input id="password" type="password" autocomplete="current-password" required maxlength="128"></label><button>登入</button></form><small>使用 SMB 檔案帳號；舊帳號請先由管理員設定一次網頁登入密碼。</small></section>
<section id="browser" hidden><div class="toolbar"><strong id="who"></strong><select id="space"></select><button id="logout">登出</button></div><p id="location"></p><div class="toolbar"><button id="up">上一層</button><button id="refresh">重新整理</button><button id="mkdir">新資料夾</button><button id="trash-mode">回收區</button><label>上傳檔案<input type="file" id="upload"></label></div><progress hidden id="upload-progress"></progress><small>刪除會移入回收區。快照只能恢復拍攝時間點已存在的內容。</small><div id="listing"><table><thead><tr><th>名稱</th><th>大小</th><th>修改／回收時間</th><th>操作</th></tr></thead><tbody id="entries"></tbody></table></div><button id="next" hidden>下一頁</button></section><p id="message" role="status"></p><script src="/js/files.js"></script></html>
